packages:
  - packages/*
  - apps/*
  - scripts
catalog:
  "@effect/platform-bun": 4.0.3
  devsess: 0.5.0
  effect: 4.0.3
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  msgpackr-extract: false
  sharp: false
overrides:
  mdast-util-to-markdown: 2.1.2
minimumReleaseAgeExclude:
  - blume@2.2.3
  - effect@4.0.3
packageExtensions:
  recharts:
    peerDependencies:
      "@types/react": "*"
peerDependencyRules:
  allowedVersions:
    tsconfck>typescript: "6"
